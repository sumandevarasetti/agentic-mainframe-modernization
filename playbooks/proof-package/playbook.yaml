name: proof-package
version: 0.3.8
artifact_type: framework-playbook
framework_stage: PROVE
portable: true
native_capability_first: true

purpose: >-
  Accumulate objective evidence for an approved transformed change set,
  classify what is actually verified, expose unexplained differences and
  unresolved evidence gaps, and prohibit progression by plausibility.

inputs:
  - approved_transform_exit_gate
  - transform_evidence_pack
  - traceable_change_set
  - pre_change_source_snapshots
  - post_change_source
  - characterization_baseline
  - behavioral_invariants
  - known_unknowns_register
  - containment_and_resolution_gates

outputs:
  - modernization_proof_package
  - evidence_classification_matrix
  - change_to_evidence_traceability
  - difference_register
  - unresolved_proof_gaps
  - prove_exit_assessment
  - artifact_persistence_record

proof_status_vocabulary:
  STATICALLY_VERIFIED: >-
    Supported by inspectable source, diff, interface, configuration, or other
    static evidence without claiming executable behavior.
  RUNTIME_VERIFIED: >-
    Supported by execution evidence from an authorized runtime.
  RUNTIME_UNAVAILABLE: >-
    Runtime evidence could not be produced because no authorized executable
    environment was available.
  NOT_VERIFIED: >-
    Required evidence is absent or insufficient.
  DIFFERENCE_EXPLAINED: >-
    A before/after difference exists and is traceable to an explicitly
    authorized change.
  DIFFERENCE_UNEXPLAINED: >-
    A before/after difference exists without sufficient approved explanation.

required_proof_dimensions:
  - scope_fidelity
  - source_diff_traceability
  - approved_change_traceability
  - behavioral_invariant_preservation
  - interface_compatibility
  - known_unknown_containment
  - unsupported_change_detection
  - rollback_evidence
  - static_validation
  - runtime_validation_status
  - unexplained_difference_detection
  - evidence_provenance
  - artifact_integrity
  - progression_authorization

claim_provenance:
  required_for_material_claims: true
  allowed_classes:
    - PRE_POST_DIFF
    - CURRENT_STATE_INSPECTION
    - AUTHORIZATION_RECORD
    - STATIC_CALL_PATH
    - STATIC_DATA_CONTRACT
    - BUILD_RESULT
    - RUNTIME_TEST
    - OPERATIONAL_EVIDENCE

historical_change_claims:
  scope: package_wide
  pre_change_baseline_or_equivalent_diff_required: true
  current_state_alone_cannot_prove_unchanged: true
  historical_terms_require_provenance_check:
    - unchanged
    - preserved
    - identical
    - same_as_before
    - retained_unchanged
  accepted_historical_provenance:
    - PRE_POST_DIFF
    - authenticated_version_history
    - equivalent_authorized_historical_evidence
  otherwise_classify: NOT_VERIFIED
  final_package_historical_claim_scan_required: true

callee_semantic_boundaries:
  caller_only_evidence_can_verify:
    - call_presence
    - call_order
    - parameter_mapping
    - caller_handling
  caller_only_evidence_cannot_verify:
    - callee_internal_business_semantics
    - callee_historical_non_change
  direct_callee_evidence_required_for_semantic_claims: true

record_layout_evidence:
  required_before_storage_representation_claims:
    - PIC
    - USAGE
    - REDEFINES
    - OCCURS
    - synchronization_or_alignment
    - relevant_record_length
  infer_packed_or_display_without_source_evidence: false
  distinguish:
    - logical_pic_positions
    - declared_cobol_representation
    - physical_encoded_byte_size
    - dataset_declared_record_size
    - runtime_record_compatibility
  logical_pic_positions_may_be_calculated_from_pic: true
  physical_byte_size_requires_representation_and_environment_evidence: true
  dataset_record_size_does_not_prove_runtime_compatibility: true
  otherwise_classify_physical_or_runtime_claim: NOT_VERIFIED

known_unknown_consistency:
  final_reconciliation_required: true
  reconcile_across:
    - known_unknown_register
    - evidence_matrices
    - narrative_findings
    - risk_highlights
    - final_summary
  conflict_classification: INTERNAL_STATUS_CONFLICT

artifact_integrity:
  changed_artifact_sha256_required_when_available: true
  preserve_pre_change_hash_when_available: true
  hash_absence_must_be_explicit: true

static_validation_vocabulary:
  source_review_only: STATICALLY_INSPECTED
  parser_or_precompiler_required_for: SYNTAX_VALIDATED
  compiler_required_for: COMPILE_VERIFIED
  link_edit_required_for: LINK_EDIT_VERIFIED
  runtime_required_for: RUNTIME_VERIFIED

progression_contract:
  prove_completion_independent_of_shift_authorization: true
  prove_may_close_for_available_evidence: true
  shift_requires_action_appropriate_evidence: true
  human_shift_authorization_required: true

artifact_persistence:
  semantic_classification_independent_of_persistence: true
  record_generation_success: true
  record_persistence_success: true
  record_persistence_method: true
  record_integrity_hash_when_persisted: true

evidence_rules:
  - every material proof claim must identify its evidence source and provenance class
  - static evidence must not be promoted to runtime evidence
  - absence of a detected difference is not runtime-equivalence proof
  - current-state inspection alone must not prove historical non-change
  - caller evidence must not be promoted to uninspected callee semantics
  - record-layout claims require exact source-level representation evidence
  - unresolved known unknowns remain visible
  - known-unknown status must be internally consistent across the final package
  - containment gates remain open unless separately resolved
  - approved interface changes must be classified as intentional differences
  - unavailable runtime evidence must be labeled RUNTIME_UNAVAILABLE
  - unsupported changes must be surfaced, not rationalized after the fact
  - proof completion and SHIFT authorization must be represented independently
  - artifact-persistence failures must not alter semantic proof classifications

difference_classification:
  expected:
    - explicitly approved source restructuring
    - explicitly approved interface change
    - explicitly approved policy change
  unexpected:
    - out_of_scope_file_change
    - unapproved_business_rule_change
    - unapproved_interface_change
    - unapproved_call_order_change
    - new_runtime_assumption
    - silent_known_unknown_resolution

permissions:
  read: true
  compare: true
  execute_tests: conditional
  modify_source: false
  modify_tests: false
  deploy: false
  production_change: false
  approve_risk: false

runtime_execution_conditions:
  - authorized_runtime_available
  - execution_is_within_approved_scope
  - test_or_validation_command_is_known
  - execution_does_not_modify_production

prohibited_actions:
  - proof_by_plausibility
  - infer_runtime_equivalence_from_static_similarity
  - infer_historical_non_change_from_current_state
  - infer_uninspected_callee_semantics_from_caller_behavior
  - infer_storage_representation_without_exact_source_evidence
  - hide_known_unknown_status_conflicts
  - hide_unresolved_unknowns
  - resolve_known_unknowns_by_assumption
  - modify_source_to_make_proof_pass
  - modify_expected_results_to_match_transformed_behavior
  - expand_scope_during_proof
  - treat_prove_completion_as_shift_authorization
  - deploy
  - authorize_production_change

evaluation:
  - evidence_completeness
  - traceability_completeness
  - unsupported_change_rate
  - behavioral_invariant_coverage
  - unexplained_difference_count
  - known_unknown_visibility
  - known_unknown_consistency
  - evidence_classification_accuracy
  - claim_provenance_accuracy
  - artifact_integrity_completeness
  - persistence_reliability

human_validation:
  required_before_stage_exit: true
  required_for_shift_authorization: true

exit_criteria:
  - required_static_evidence_complete_for_available_environment
  - all_detected_differences_classified
  - no_unexplained_high_impact_difference_accepted
  - unresolved_runtime_dimensions_explicit
  - known_unknown_consistency_check_passed_or_conflicts_explicit
  - package_wide_historical_claim_scan_passed_or_unsupported_claims_marked_not_verified
  - logical_layout_and_physical_byte_claims_distinguished
  - artifact_integrity_status_explicit
  - prove_completion_and_shift_authorization_recorded_separately
  - human_prove_gate_recorded

failure_modes:
  - proof_by_plausibility
  - evidence_classification_inflation
  - historical_non_change_without_baseline
  - caller_to_callee_semantic_overreach
  - record_layout_inference_without_source_evidence
  - known_unknown_status_conflict
  - static_validation_vocabulary_inflation
  - persistence_failure_hidden_as_reasoning_failure
  - silent_regression_acceptance
  - runtime_claim_without_runtime_evidence
