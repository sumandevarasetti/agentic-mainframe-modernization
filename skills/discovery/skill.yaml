name: discovery
version: 0.3.0
framework_stage: UNDERSTAND
portable: true
ibm_bob_native_syntax: false
purpose: Build a capability-scoped inventory of entry points, artifacts, and dependency categories.
inputs:
  - capability
  - business_request
  - workspace_source
  - optional_static_analysis_metadata
outputs:
  - capability_definition
  - entry_points
  - artifact_inventory
  - dependency_candidates
  - known_unknowns
permissions:
  read_only: true
  modify_source: false
  deploy: false
prohibited_actions:
  - select_modernization_disposition
  - modify_repository
  - read_evaluation_ground_truth_during_scored_run
evidence_required:
  - artifact_references
  - relationship_references
human_gate:
  required: false
  note: Human validation is required before UNDERSTAND stage exit.
evaluation:
  - entry_point_recall
  - dependency_recall
  - evidence_traceability
  - unsupported_claim_rate
  - known_unknown_detection
