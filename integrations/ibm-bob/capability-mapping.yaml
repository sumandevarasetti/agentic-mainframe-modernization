mapping_name: agentic-strangler-to-ibm-bob-pp4z
version: 0.3.6
verification_date: 2026-09-16
product: IBM Bob Premium Package for Z
principle: native-capability-first

mappings:
  UNDERSTAND:
    preferred_mode: Z Architect
    native_capabilities:
      initialization:
        - /init
      dependency_and_change_analysis:
        - impact-analysis skill
        - /impact-analysis
        - Z Understand analysis
      explanation:
        - explain skill
        - /explain
    framework_responsibility:
      - define evidence contract
      - identify known unknowns
      - normalize evidence
      - require human stage-exit validation

  DECIDE:
    native_capabilities_used_as_inputs:
      - impact-analysis
      - Z Understand analysis
    framework_responsibility:
      - apply modernization decision matrix
      - preserve KEEP as valid outcome
      - carry unknowns as constraints
      - require named human decision owner
    human_authority: required

  PLAN:
    preferred_mode: Z Architect
    native_capabilities:
      - implementation-planning skill
      - /implementation-planning
    framework_responsibility:
      - enforce approved human disposition
      - bound in-scope and out-of-scope work
      - define dependency-ordered change slices
      - carry forward unresolved unknowns as gates
      - define proof and acceptance evidence
      - define rollback and abort criteria
      - require plan/risk acceptance by a named human
    human_authority: required
    source_modification_allowed: false

  TRANSFORM:
    preferred_mode: Z Code
    native_capabilities:
      - Refactor COBOL or PL/I program workflow
      - Generate refactored service program workflow
      - End-to-end transformation workflow
    framework_responsibility:
      - require slice-specific human authorization
      - enforce resolution and containment gates
      - constrain changes to approved artifacts
      - capture source-level diffs
      - preserve Objective-to-Evidence-to-Decision-to-Plan-to-Change traceability
      - record static and runtime validation status separately
      - require rollback evidence
      - prohibit deployment and production authorization
    human_authority: required
    source_modification_allowed: conditional
    deploy_allowed: false
    production_change_allowed: false

  PROVE:
    native_capabilities:
      - transformation validation
      - coding standards enforcement
      - ZCodeScan integration
    framework_responsibility:
      - assemble modernization proof package
      - classify expected differences vs regressions
      - determine evidence sufficiency through human gate

  SHIFT:
    native_mapping_status: not_claimed_as_complete
    framework_responsibility:
      - define progressive exposure
      - telemetry thresholds
      - rollback bounds
      - human production authority

  LEARN:
    native_mapping_status: compositional
    framework_responsibility:
      - convert outcomes into reusable knowledge
      - update tests, evidence and guidance
      - feed next UNDERSTAND cycle

warnings:
  - Framework playbooks are not IBM Bob Skills.
  - Framework agent YAML is not claimed to be IBM Bob-native agent syntax.
  - Product behavior must be re-verified before publication.
  - Runtime validation must not be claimed without authorized execution evidence.
